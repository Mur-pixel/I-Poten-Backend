server:
  port: 8080

spring:
  application:
    name: ipoten

  task:
    scheduling:
      time-zone: Asia/Seoul

  datasource:
    url: jdbc:mysql://${SPRING_DATABASE_HOST}:3306/${SPRING_DATABASE_NAME}
    username: ${SPRING_DATABASE_USER}
    password: ${SPRING_DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # 보안: 기본값 제거. 환경변수로 반드시 주입.
      password: ${SPRING_DATA_REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    database-platform: org.hibernate.dialect.MySQL8Dialect

kakao:
  login-url: ${KAKAO_LOGIN_URL:https://kauth.kakao.com/oauth/authorize}
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  token-request-uri: ${KAKAO_TOKEN_REQUEST_URI:https://kauth.kakao.com/oauth/token}
  user-info-request-uri: ${KAKAO_USER_INFO_REQUEST_URI:https://kapi.kakao.com/v2/user/me}

github:
  login-url: ${GITHUB_LOGIN_URL}
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: ${GITHUB_REDIRECT_URL}
  token-request-uri: ${GITHUB_TOKEN_REQUEST_URL}
  user-info-request-uri: ${GITHUB_USER_INFO_REQUEST_URL}

naver:
  login-url: ${NAVER_LOGIN_URL}
  client-id: ${NAVER_CLIENT_ID}
  redirect-uri: ${NAVER_REDIRECT_URI}
  client-secret: ${NAVER_CLIENT_SECRET}
  token-request-uri: ${NAVER_TOKEN_REQUEST_URI}
  user-info-request-uri: ${NAVER_USER_INFO_REQUEST_URI}

google:
  login-url: ${GOOGLE_LOGIN_URL}
  client-id: ${GOOGLE_CLIENT_ID}
  redirect-uri: ${GOOGLE_REDIRECT_URI}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  token-request-uri: ${GOOGLE_TOKEN_REQUEST_URI}
  user-info-request-uri: ${GOOGLE_USER_INFO_REQUEST_URI}

apple:
  client-id: ${APPLE_CLIENT_ID}
  ios-bundle-id: ${APPLE_IOS_BUNDLE_ID:com.cygnus.iPotenApp}
  client-secret: ${APPLE_CLIENT_SECRET}
  redirect-uri: ${APPLE_REDIRECT_URI}
  token-request-uri: ${APPLE_TOKEN_REQUEST_URI:https://appleid.apple.com/auth/token}
  android-package-name: ${APPLE_ANDROID_PACKAGE_NAME}

meta:
  login-url: ${META_LOGIN_URL}
  client-id: ${META_CLIENT_ID}
  redirect-uri: ${META_REDIRECT_URI}
  token-request-uri: ${META_TOKEN_REQUEST_URI}
  user-info-request-uri: ${META_USER_INFO_REQUEST_URI}

cors:
  allow:
    origins: ${CORS_ALLOWED_ORIGINS}

frontend:
  authentication:
    origins: ${FRONTEND_AUTHENTICATION_ORIGINS}

admin:
  secret-id-key: ${ADMINISTRATOR_SECRET_KEY_ID}
  secret-password-key : ${ADMINISTRATOR_SECRET_KEY_PASSWORD}
  first-admin-email : ${ADMINISTRATOR_FIRST_USER_EMAIL}
  first-admin-nickname : ${ADMINISTRATOR_FIRST_USER_NICKNAME}
  first-admin-logintype: ${ADMINISTRATOR_FIRST_USER_LOGINTYPE}
  admin-aws-access-key : ${ADMINISTRATOR_AWS_ACCESS_KEY}
  admin-aws-secret-key : ${ADMINISTRATOR_AWS_SECRET_KEY}

gcp:
  tts:
    api-key: ${GCP_TTS_API_KEY}

logging:
  level:
    org.springframework: INFO
  pattern:
    # %X{traceId} 는 RequestTraceFilter 에서 MDC 에 주입한 요청 추적 ID.
    # 동일 요청에서 발생한 모든 로그를 traceId 로 grep 하여 추적 가능.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-}] %logger{36} - %msg%n"

ebook:
  pdf:
    font-path: classpath:/fonts/NotoSansKR-Regular.ttf

current_server:
  end_interview_url: ${END_INTERVIEW_CALLBACK_URL}

aws:
  ses:
    region: ${AWS_SES_REGION:ap-northeast-2}
    access-key: ${AWS_SES_ACCESS_KEY}
    secret-key: ${AWS_SES_SECRET_KEY}
    from-email: ${AWS_SES_FROM_EMAIL}
  s3:
    bucket: ${AWS_S3_BUCKET}

cdn:
  base-url: ${BASE_URL}

cloud:
  aws:
    region:
      static: ap-northeast-2
    s3:
      bucket:
        profile-images: jobspoon-profile-images
        report-files: jobspoon-report-files
    credentials:
      profile:
        access-key: ${PROFILE_AWS_ACCESS_KEY_ID}
        secret-key: ${PROFILE_AWS_SECRET_ACCESS_KEY}
      report:
        access-key: ${REPORT_AWS_ACCESS_KEY_ID}
        secret-key: ${REPORT_AWS_SECRET_ACCESS_KEY}

openai:
  api:
    admin-key: ${OPENAI_API_ADMIN_KEY}

fastapi:
  uri: ${FASTAPI_URI}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

internal:
  api:
    key: ${INTERNAL_API_KEY:}