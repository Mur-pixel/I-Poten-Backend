name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
        
      - name: Create environment file
        run: |
          echo "${{ secrets.PRODUCTION_ENV }}" > .env
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: i-cygnus
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image (AMD64 only)
        run: |
          docker build --platform linux/amd64 -t ghcr.io/i-cygnus/spring-backend:latest .
          docker push ghcr.io/i-cygnus/spring-backend:latest



          
  deploy:
    needs: build
    name: Deploy to EC2
    runs-on: [ self-hosted, i-poten-backend ]
    steps:
      - name: Stop existing container
        run: |
          cd /home/ec2-user/i-poten/backend
          docker compose stop server || true
          docker rm spring-backend || true
      
      - name: Login to GHCR and pull latest image
        run: |
          echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u i-cygnus --password-stdin
          docker pull ghcr.io/i-cygnus/spring-backend:latest
          docker logout
      
      - name: Start services
        run: |
          cd /home/ec2-user/i-poten/backend
          docker compose up -d
          
      - name: Clean up unused images
        run: docker image prune -f

