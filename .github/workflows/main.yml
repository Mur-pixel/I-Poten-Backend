name: Deploy

on:
  push:
    branches:
      - main



jobs:
  build:
    name: build-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu' # https://github.com/actions/setup-java

      ## gradle caching
      # - name: Gradle Caching
      #   uses: actions/cache@v3
      #   with:
      #     path: |
      #       ~/.gradle/caches
      #       ~/.gradle/wrapper
      #     key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      #     restore-keys: |
      #       ${{ runner.os }}-gradle-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: i-cygnus
          password: ${{ secrets.GHCR_TOKEN }}
        
      - name: Create application.yaml for CD Deploy
        run: |
          echo "${{ secrets.PRODUCTION_ENV }}" > .env
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          ls
          ./gradlew clean build -x test

      - name: Docker build & push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/i-cygnus/spring-backend:latest



          
  deploy:
    needs: build
    name: Deploy
    runs-on: [ self-hosted, i-poten-backend ]
    steps:
      - name: Deploy to Production (local shell)
        run: |
          cd /home/ec2-user/i-poten/backend
          docker compose stop server  # 기존 DB/Redis는 유지
      
          echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u i-cygnus --password-stdin
          docker pull ghcr.io/i-cygnus/spring-backend:latest
          docker image prune -f
          docker logout
      
          docker compose up -d

